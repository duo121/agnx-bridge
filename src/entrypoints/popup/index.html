<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGNX Bridge Control</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel">
      <section class="hero">
        <div class="hero-row">
          <div>
            <p class="eyebrow">LOCAL BRIDGE</p>
            <h1>AGNX Bridge</h1>
          </div>
          <div class="status-cluster" id="statusCluster">
            <div class="status-pill" id="statusPill" data-tone="paused">已关闭</div>
            <p class="status-sub" id="statusSub">改端口后点开启</p>
          </div>
        </div>
      </section>

      <section class="tabs">
        <button class="tab-button" id="tabControlButton" data-active="true" type="button">控制台</button>
        <button class="tab-button" id="tabHistoryButton" data-active="false" type="button">调用记录</button>
      </section>

      <div class="tab-panel tab-panel-control" id="controlTabPanel">
        <div class="control-scroll">
          <section class="card">
            <div class="label-row">
              <label for="portInput">桥接端口</label>
              <span class="label-badge">仅数字</span>
            </div>
            <div class="field-shell">
              <input id="portInput" type="number" min="1" max="65535" inputmode="numeric" />
              <button class="action action-ghost action-tiny" id="copyUrlButton" type="button" title="复制 http://localhost:端口">
                复制地址
              </button>
            </div>
            <p class="address-hint">
              Agent / curl 使用
              <code id="backendUrl">http://localhost:3054</code>
            </p>

            <div class="registration-row">
              <div class="registration-main">
                <span class="meta-label">本机注册</span>
                <strong id="clientSummary">未注册</strong>
              </div>
              <button class="client-id-toggle" id="clientIdToggle" type="button" hidden>
                查看 Client ID
              </button>
              <code class="client-id-value" id="clientId" hidden></code>
            </div>
          </section>

          <p class="alert-line" id="alertLine" hidden></p>
        </div>

        <section class="actions actions-dock">
          <button class="action action-primary" id="enableButton" type="button">开启桥接</button>
          <button class="action action-secondary" id="disableButton" type="button">关闭桥接</button>
        </section>
      </div>

      <div class="tab-panel tab-panel-hidden" id="historyTabPanel">
        <p class="history-intro">Agent 经 Bridge 调用后的记录，便于复制 curl 复现。</p>
        <section class="history-actions">
          <button class="action action-ghost" id="refreshHistoryButton" type="button">刷新</button>
          <button class="action action-ghost" id="copyAllCurlButton" type="button">复制全部 curl</button>
          <button class="action action-ghost" id="clearHistoryButton" type="button">清空</button>
        </section>

        <section class="history-shell">
          <div class="history-empty" id="historyEmpty">暂无调用记录。</div>
          <div class="history-list" id="historyList"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
