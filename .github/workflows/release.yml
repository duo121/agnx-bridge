# 场景：GitHub Release 构建扩展 zip，供用户下载后 Load unpacked
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm zip
      - name: Pack release artifacts
        run: |
          mkdir -p dist-release
          tar -czf dist-release/agnx-bridge-native-host-runtime.tar.gz \
            native-host server scripts/install-native-host.mjs scripts/extension-identity.mjs \
            scripts/install.sh scripts/install-skill.sh keys
          cp -R .output/chrome-mv3 dist-release/chrome-mv3
          (cd dist-release && zip -r agnx-bridge-chrome-mv3.zip chrome-mv3)
          cp scripts/install.sh dist-release/install.sh
          ls -la .output/*.zip 2>/dev/null || true
          cp .output/*.zip dist-release/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-release/agnx-bridge-chrome-mv3.zip
            dist-release/agnx-bridge-native-host-runtime.tar.gz
            dist-release/install.sh
            dist-release/*.zip
          body: |
            ## 安装
            1. 下载 `agnx-bridge-chrome-mv3.zip`，解压后在 Chrome 开发者模式加载 `chrome-mv3/`
            2. `AGNX_BRIDGE_GITHUB_OWNER=<owner> curl -fsSL https://raw.githubusercontent.com/<owner>/agnx-bridge/main/scripts/install.sh | bash`
            3. 扩展 popup 开启桥接（默认端口 3054）
            4. `curl -sS http://localhost:3054/api/agnx-bridge/health`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
